name: Update scanner

on:
  schedule:
    - cron: "15 14 * * 1-5"
    - cron: "30 16 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore downloaded NSE files
        uses: actions/cache@v4
        with:
          path: nse_cache
          key: nse-cache-${{ github.run_id }}
          restore-keys: nse-cache-
      - name: Build scanner
        env:
          OUT_DIR: site
          NSE_CACHE: nse_cache
          TZ: Asia/Kolkata
        run: |
          pip install requests
          python nse_scanner.py
      - name: Save data copy for Claude
        run: |
          mkdir -p data
          python - <<'PY'
          import re, json, csv
          h = open("site/index.html", encoding="utf-8").read()
          d = json.loads(re.search(r"const D = (\{.*?\});\n", h, re.S).group(1))
          m, periods = d["meta"], [p[0] for p in d["meta"]["periods"]]
          idx = {}
          for name, syms in d["indices"].items():
              for s in syms:
                  idx.setdefault(s, []).append(name)
          with open("data/scan.csv", "w", newline="", encoding="utf-8") as f:
              w = csv.writer(f)
              w.writerow(["Symbol", "Name", "Segment", "Series", "Sector", "Close"]
                         + ["Chg_" + p for p in periods] + ["Volume", "Value_Cr", "Indices"])
              for s in d["stocks"]:
                  w.writerow([s["s"], s["n"], s["seg"], s["sr"], s["sec"], s["c"]]
                             + [s["ch"].get(p, "") for p in periods]
                             + [s["v"], s["tv"], "; ".join(idx.get(s["s"], []))])
          json.dump(m, open("data/info.json", "w"), indent=1)
          PY
          git config user.name "scanner-bot"
          git config user.email "scanner-bot@users.noreply.github.com"
          git add data
          git commit -m "Data for $(date +%d-%b-%Y)" || echo "no change"
          git push
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
